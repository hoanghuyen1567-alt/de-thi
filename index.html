<label><input type="radio" name="q3" value="d"> D. Giao diện đồ hoạ.</label>
        </div>

        <div class="question" id="q4">
            <p>Câu 4. Phát biểu nào mô tả đúng nhất vai trò của hệ điều hành đối với phần mềm ứng dụng?</p>
            <label><input type="radio" name="q4" value="a"> A. Hệ điều hành thay thế hoàn toàn phần mềm ứng dụng.</label>
            <label><input type="radio" name="q4" value="b"> B. Hệ điều hành cung cấp môi trường để phần mềm ứng dụng khai thác phần cứng.</label>
            <label><input type="radio" name="q4" value="c"> C. Hệ điều hành chỉ dùng để lưu tệp.</label>
            <label><input type="radio" name="q4" value="d"> D. Hệ điều hành chỉ hoạt động khi máy tính không kết nối Internet.</label>
        </div>

        <button onclick="checkAnswers()">Nộp bài</button>
        <div id="result" class="result"></div>
    </div>

    <script>
        function checkAnswers() {
            let score = 0;
            // Đáp án mẫu: Câu 1: c, Câu 2: a, Câu 3: d, Câu 4: b
            const answers = { q1: 'c', q2: 'a', q3: 'd', q4: 'b' };
            
            for (let key in answers) {
                let userSelect = document.querySelector(`input[name="${key}"]:checked`);
                if (userSelect && userSelect.value === answers[key]) {
                    score++;
                }
            }
            document.getElementById('result').innerText = `Bạn đã trả lời đúng ${score}/4 câu hỏi mẫu!`;
        }
    </script>

</body>
</html>
